name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    # FORÇAGE ABSOLU SUR TOUS LES SOUS-PROCESSUS (GRADLE, KOTLIN, KSP)
    env:
      _JAVA_OPTIONS: "-Xmx4g -Djava.awt.headless=true -XX:+UseParallelGC"

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Rendre le wrapper Gradle exécutable
        run: chmod +x ./gradlew

      - name: Compilation de l'APK (Purge Cache, AVEC Daemon)
        # SUPPRESSION CRITIQUE de --no-daemon pour éviter le crash du contexte IntelliJ de KSP
        run: ./gradlew clean assembleDebug --no-build-cache

      - name: Upload de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
